<svg xmlns="http://www.w3.org/2000/svg" width="280" height="160" viewBox="0 0 280 160">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0a1e"/>
      <stop offset="1" stop-color="#0d1433"/>
    </linearGradient>
  </defs>
  <rect width="280" height="160" fill="url(#bg)"/>
  <!-- Grid lines -->
  <line x1="0" y1="40" x2="280" y2="40" stroke="#00d4ff" stroke-width="0.4" opacity="0.2"/>
  <line x1="0" y1="80" x2="280" y2="80" stroke="#00d4ff" stroke-width="0.4" opacity="0.2"/>
  <line x1="0" y1="120" x2="280" y2="120" stroke="#00d4ff" stroke-width="0.4" opacity="0.2"/>
  <line x1="70" y1="0" x2="70" y2="160" stroke="#00d4ff" stroke-width="0.4" opacity="0.2"/>
  <line x1="140" y1="0" x2="140" y2="160" stroke="#00d4ff" stroke-width="0.4" opacity="0.2"/>
  <line x1="210" y1="0" x2="210" y2="160" stroke="#00d4ff" stroke-width="0.4" opacity="0.2"/>
  <!-- Calendar blocks -->
  <rect x="20" y="50" width="50" height="28" rx="4" fill="#00d4ff" opacity="0.15" stroke="#00d4ff" stroke-width="1"/>
  <rect x="80" y="50" width="80" height="28" rx="4" fill="#5f27cd" opacity="0.25" stroke="#5f27cd" stroke-width="1"/>
  <rect x="170" y="50" width="90" height="28" rx="4" fill="#00d4ff" opacity="0.1" stroke="#00d4ff" stroke-width="0.5"/>
  <rect x="20" y="90" width="130" height="28" rx="4" fill="#2ed573" opacity="0.1" stroke="#2ed573" stroke-width="1"/>
  <rect x="160" y="90" width="100" height="28" rx="4" fill="#00d4ff" opacity="0.15" stroke="#00d4ff" stroke-width="1"/>
  <!-- Title -->
  <text x="140" y="24" font-family="'Courier New', monospace" font-size="16" text-anchor="middle" fill="#00d4ff" font-weight="bold" letter-spacing="3">GAPTIME</text>
  <!-- Labels -->
  <text x="45" y="68" font-family="monospace" font-size="9" text-anchor="middle" fill="#00d4ff">SYNC</text>
  <text x="120" y="68" font-family="monospace" font-size="9" text-anchor="middle" fill="#bf00ff">SCHEDULE</text>
  <text x="85" y="108" font-family="monospace" font-size="9" text-anchor="middle" fill="#2ed573">AVAILABLE</text>
  <!-- Tech badge -->
  <rect x="80" y="132" width="55" height="16" rx="3" fill="none" stroke="#00d4ff" stroke-width="1" opacity="0.7"/>
  <rect x="145" y="132" width="55" height="16" rx="3" fill="none" stroke="#5f27cd" stroke-width="1" opacity="0.7"/>
  <text x="107" y="144" font-family="monospace" font-size="9" text-anchor="middle" fill="#00d4ff">React.js</text>
  <text x="172" y="144" font-family="monospace" font-size="9" text-anchor="middle" fill="#bf00ff">JavaScript</text>
  <!-- Live dot -->
  <circle cx="252" cy="18" r="5" fill="#2ed573" opacity="0.9"/>
  <text x="244" y="14" font-family="monospace" font-size="8" fill="#2ed573" text-anchor="end">LIVE</text>
</svg>
