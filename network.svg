<svg xmlns="http://www.w3.org/2000/svg" width="280" height="160" viewBox="0 0 280 160">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a1a0a"/>
      <stop offset="1" stop-color="#0a0a1e"/>
    </linearGradient>
  </defs>
  <rect width="280" height="160" fill="url(#bg)"/>
  <!-- Network connection lines -->
  <line x1="140" y1="70" x2="50" y2="35" stroke="#2ed573" stroke-width="1" opacity="0.6"/>
  <line x1="140" y1="70" x2="230" y2="35" stroke="#2ed573" stroke-width="1" opacity="0.6"/>
  <line x1="140" y1="70" x2="50" y2="120" stroke="#2ed573" stroke-width="1" opacity="0.6"/>
  <line x1="140" y1="70" x2="230" y2="120" stroke="#2ed573" stroke-width="1" opacity="0.6"/>
  <line x1="50" y1="35" x2="230" y2="35" stroke="#2ed573" stroke-width="0.5" opacity="0.3"/>
  <line x1="50" y1="120" x2="230" y2="120" stroke="#2ed573" stroke-width="0.5" opacity="0.3"/>
  <line x1="50" y1="35" x2="50" y2="120" stroke="#2ed573" stroke-width="0.5" opacity="0.3"/>
  <line x1="230" y1="35" x2="230" y2="120" stroke="#2ed573" stroke-width="0.5" opacity="0.3"/>
  <!-- Central router node -->
  <circle cx="140" cy="70" r="16" fill="#0a1a0a" stroke="#2ed573" stroke-width="2"/>
  <text x="140" y="74" font-family="monospace" font-size="8" text-anchor="middle" fill="#2ed573">ROUTER</text>
  <!-- Edge nodes -->
  <circle cx="50" cy="35" r="11" fill="#0a1a0a" stroke="#00d4ff" stroke-width="1.5"/>
  <text x="50" y="39" font-family="monospace" font-size="7" text-anchor="middle" fill="#00d4ff">SW1</text>
  <circle cx="230" cy="35" r="11" fill="#0a1a0a" stroke="#00d4ff" stroke-width="1.5"/>
  <text x="230" y="39" font-family="monospace" font-size="7" text-anchor="middle" fill="#00d4ff">SW2</text>
  <circle cx="50" cy="120" r="11" fill="#0a1a0a" stroke="#5f27cd" stroke-width="1.5"/>
  <text x="50" y="124" font-family="monospace" font-size="7" text-anchor="middle" fill="#5f27cd">PC1</text>
  <circle cx="230" cy="120" r="11" fill="#0a1a0a" stroke="#5f27cd" stroke-width="1.5"/>
  <text x="230" y="124" font-family="monospace" font-size="7" text-anchor="middle" fill="#5f27cd">PC2</text>
  <!-- Title -->
  <text x="140" y="12" font-family="'Courier New', monospace" font-size="11" text-anchor="middle" fill="#2ed573" font-weight="bold" letter-spacing="2">NETWORK SIM</text>
  <!-- Protocol labels -->
  <text x="140" y="147" font-family="monospace" font-size="8" text-anchor="middle" fill="#2ed573">VLSM · RIPv2 · DHCP · DNS · SMTP</text>
  <text x="140" y="158" font-family="monospace" font-size="8" text-anchor="middle" fill="#8892b0">Cisco Packet Tracer</text>
</svg>
