<svg xmlns="http://www.w3.org/2000/svg" width="280" height="160" viewBox="0 0 280 160">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a0a0a"/>
      <stop offset="1" stop-color="#0a0a1e"/>
    </linearGradient>
  </defs>
  <rect width="280" height="160" fill="url(#bg)"/>
  <!-- Terminal window frame -->
  <rect x="15" y="25" width="250" height="120" rx="6" fill="#0f0f1e" stroke="#b3323e" stroke-width="1.5"/>
  <!-- Terminal title bar -->
  <rect x="15" y="25" width="250" height="22" rx="6" fill="#1a0a0a" stroke="#b3323e" stroke-width="1.5"/>
  <rect x="15" y="36" width="250" height="11" fill="#1a0a0a"/>
  <!-- Window control dots -->
  <circle cx="31" cy="36" r="4" fill="#ff4757"/>
  <circle cx="45" cy="36" r="4" fill="#ffa502"/>
  <circle cx="59" cy="36" r="4" fill="#2ed573"/>
  <text x="140" y="41" font-family="monospace" font-size="9" text-anchor="middle" fill="#8892b0">codeforces_solutions.py</text>
  <!-- Code lines -->
  <text x="28" y="63" font-family="'Courier New', monospace" font-size="9" fill="#5f27cd">def</text>
  <text x="51" y="63" font-family="'Courier New', monospace" font-size="9" fill="#00d4ff">solve</text>
  <text x="86" y="63" font-family="'Courier New', monospace" font-size="9" fill="#e6f1ff">(n, arr):</text>
  <text x="28" y="78" font-family="'Courier New', monospace" font-size="9" fill="#8892b0">  # 50+ problems solved</text>
  <text x="28" y="93" font-family="'Courier New', monospace" font-size="9" fill="#e6f1ff">  ans = </text>
  <text x="80" y="93" font-family="'Courier New', monospace" font-size="9" fill="#ffa502">sorted</text>
  <text x="122" y="93" font-family="'Courier New', monospace" font-size="9" fill="#e6f1ff">(arr)</text>
  <text x="28" y="108" font-family="'Courier New', monospace" font-size="9" fill="#5f27cd">  return</text>
  <text x="77" y="108" font-family="'Courier New', monospace" font-size="9" fill="#2ed573">ans</text>
  <!-- Cursor blink -->
  <rect x="28" y="118" width="6" height="11" fill="#00d4ff" opacity="0.8"/>
  <!-- Stats badge -->
  <rect x="160" y="68" width="95" height="55" rx="4" fill="none" stroke="#b3323e" stroke-width="1" opacity="0.7"/>
  <text x="207" y="83" font-family="monospace" font-size="9" text-anchor="middle" fill="#b3323e">COMPETITIVE</text>
  <text x="207" y="97" font-family="monospace" font-size="18" text-anchor="middle" fill="#ff4757" font-weight="bold">50+</text>
  <text x="207" y="112" font-family="monospace" font-size="8" text-anchor="middle" fill="#8892b0">problems solved</text>
  <!-- Title -->
  <text x="140" y="16" font-family="'Courier New', monospace" font-size="10" text-anchor="middle" fill="#b3323e" font-weight="bold" letter-spacing="2">CODEFORCES · PYTHON</text>
</svg>
