<svg xmlns="http://www.w3.org/2000/svg" width="280" height="160" viewBox="0 0 280 160">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a1000"/>
      <stop offset="1" stop-color="#0a0a1e"/>
    </linearGradient>
  </defs>
  <rect width="280" height="160" fill="url(#bg)"/>
  <!-- Speedometer arc -->
  <path d="M 70 110 A 70 70 0 0 1 210 110" fill="none" stroke="#333" stroke-width="12" stroke-linecap="round"/>
  <path d="M 70 110 A 70 70 0 0 1 140 40" fill="none" stroke="#ffa502" stroke-width="10" stroke-linecap="round"/>
  <!-- Tick marks -->
  <line x1="70" y1="110" x2="80" y2="103" stroke="#ffa502" stroke-width="1.5" opacity="0.5"/>
  <line x1="90" y1="72" x2="97" y2="78" stroke="#ffa502" stroke-width="1.5" opacity="0.5"/>
  <line x1="140" y1="45" x2="140" y2="54" stroke="#ffa502" stroke-width="2"/>
  <line x1="190" y1="72" x2="183" y2="78" stroke="#ffa502" stroke-width="1.5" opacity="0.5"/>
  <line x1="210" y1="110" x2="200" y2="103" stroke="#ffa502" stroke-width="1.5" opacity="0.5"/>
  <!-- Needle -->
  <line x1="140" y1="110" x2="140" y2="50" stroke="#ff4757" stroke-width="2" stroke-linecap="round"/>
  <circle cx="140" cy="110" r="6" fill="#ff4757"/>
  <circle cx="140" cy="110" r="3" fill="#0a0a1e"/>
  <!-- Speed labels -->
  <text x="62" y="128" font-family="monospace" font-size="9" fill="#ffa502" opacity="0.8">1x</text>
  <text x="128" y="35" font-family="monospace" font-size="9" fill="#ffa502" opacity="0.8">2x</text>
  <text x="212" y="128" font-family="monospace" font-size="9" fill="#ffa502" opacity="0.8">4x</text>
  <!-- Title -->
  <text x="140" y="14" font-family="'Courier New', monospace" font-size="13" text-anchor="middle" fill="#ffa502" font-weight="bold" letter-spacing="1">SPEED CALCULATOR</text>
  <!-- Result display -->
  <rect x="95" y="118" width="90" height="22" rx="4" fill="none" stroke="#ffa502" stroke-width="1" opacity="0.6"/>
  <text x="140" y="133" font-family="monospace" font-size="10" text-anchor="middle" fill="#ffa502">Playback Timer</text>
  <!-- Tech badge -->
  <text x="140" y="154" font-family="monospace" font-size="8" text-anchor="middle" fill="#8892b0">HTML · JavaScript · Live Tool</text>
</svg>
