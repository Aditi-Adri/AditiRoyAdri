<svg xmlns="http://www.w3.org/2000/svg" width="280" height="160" viewBox="0 0 280 160">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a0a1e"/>
      <stop offset="1" stop-color="#0a0a1e"/>
    </linearGradient>
  </defs>
  <rect width="280" height="160" fill="url(#bg)"/>
  <!-- U-Net architecture visualization -->
  <!-- Encoder path (left) -->
  <rect x="15" y="30" width="28" height="18" rx="2" fill="#5f27cd" opacity="0.7" stroke="#bf00ff" stroke-width="1"/>
  <rect x="15" y="55" width="22" height="15" rx="2" fill="#5f27cd" opacity="0.6" stroke="#bf00ff" stroke-width="1"/>
  <rect x="15" y="77" width="16" height="12" rx="2" fill="#5f27cd" opacity="0.5" stroke="#bf00ff" stroke-width="1"/>
  <!-- Bottleneck -->
  <rect x="120" y="90" width="40" height="22" rx="3" fill="#b3323e" opacity="0.6" stroke="#ff4757" stroke-width="1.5"/>
  <text x="140" y="105" font-family="monospace" font-size="8" text-anchor="middle" fill="#ff4757">BOTTLENECK</text>
  <!-- Decoder path (right) -->
  <rect x="237" y="30" width="28" height="18" rx="2" fill="#2ed573" opacity="0.7" stroke="#2ed573" stroke-width="1"/>
  <rect x="243" y="55" width="22" height="15" rx="2" fill="#2ed573" opacity="0.6" stroke="#2ed573" stroke-width="1"/>
  <rect x="249" y="77" width="16" height="12" rx="2" fill="#2ed573" opacity="0.5" stroke="#2ed573" stroke-width="1"/>
  <!-- Skip connections -->
  <line x1="43" y1="39" x2="237" y2="39" stroke="#00d4ff" stroke-width="0.8" stroke-dasharray="4 2" opacity="0.5"/>
  <line x1="37" y1="62" x2="243" y2="62" stroke="#00d4ff" stroke-width="0.8" stroke-dasharray="4 2" opacity="0.4"/>
  <line x1="31" y1="83" x2="249" y2="83" stroke="#00d4ff" stroke-width="0.8" stroke-dasharray="4 2" opacity="0.35"/>
  <!-- Arrows encoder to bottleneck -->
  <line x1="43" y1="83" x2="118" y2="98" stroke="#bf00ff" stroke-width="1" opacity="0.6"/>
  <!-- Arrows bottleneck to decoder -->
  <line x1="162" y1="98" x2="237" y2="83" stroke="#2ed573" stroke-width="1" opacity="0.6"/>
  <!-- Title -->
  <text x="140" y="17" font-family="'Courier New', monospace" font-size="13" text-anchor="middle" fill="#bf00ff" font-weight="bold" letter-spacing="1">PET AI VISION</text>
  <!-- Stats -->
  <text x="140" y="135" font-family="monospace" font-size="8" text-anchor="middle" fill="#bf00ff">U-Net · Attention U-Net · ResNet-34</text>
  <text x="140" y="148" font-family="monospace" font-size="8" text-anchor="middle" fill="#2ed573">88% IoU · 37 Breeds · PyTorch</text>
  <!-- Labels -->
  <text x="29" y="26" font-family="monospace" font-size="7" text-anchor="middle" fill="#bf00ff">ENC</text>
  <text x="251" y="26" font-family="monospace" font-size="7" text-anchor="middle" fill="#2ed573">DEC</text>
</svg>
